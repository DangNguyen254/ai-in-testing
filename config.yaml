# ticket2test configuration. Every value can be overridden by an env var:
#   T2T_<SECTION>__<KEY>, e.g. T2T_RETRIEVAL__TOP_K=5
# Secrets never go in this file. See .env.example.

llm:
  provider: claude_code_cli    # claude_code_cli | claude | gemini
  # Used where supported (Gemini). The Claude CLI has no temperature setting and current
  # Claude models reject non-default values, so Claude output is not fully deterministic.
  temperature: 0.0
  seed: 0
  max_retries_on_bad_json: 2
  max_output_tokens: 16000
  timeout_seconds: 300
  claude_code_cli:
    executable: claude         # or set T2T_LLM__CLAUDE_CODE_CLI__EXECUTABLE to a full path
    model: claude-sonnet-5-5
    # Per-step override of `model` (steps: draft, query_rewrite, retrieval_followup, investigate,
    # generate, variant_plan, guide). E.g. guide: claude-opus-5-5 to write guides with Opus.
    # Empty: every step uses `model`. Haiku 4.5 for the retrieval steps was tried on 2026-10-06
    # and was worse, slower, and not cheaper (PROJECT_STATUS, Phase 6 log).
    # Haiku 5.5 on every step (2026-10-22) matched Sonnet 5.5 on the stand-in generation eval
    # (PROJECT_STATUS, 2026-10-22).
    step_models: {}
    workdir: .scratch/claude-cli   # git-ignored, inside the repo
  claude:                      # Anthropic API; key from ANTHROPIC_API_KEY
    model: claude-sonnet-5-5
    step_models: {}
    fallbacks: true            # server-side refusal fallback
    effort: null               # low | medium | high | xhigh | max (null = model default)
  gemini:                      # key from GEMINI_API_KEY
    model: ""                  # required when provider is gemini

draft:
  prompt_version: draft_v2
  max_comment_chars: 20000
  skeleton: auto                 # partial draft + open questions: auto (insufficient, or no explicit
                                 # steps/expected section in the ticket) | always | never
  skeleton_prompt: skeleton_v1

markers:                       # generic placeholders; set real values per environment
  priorities: [p0, p1, p2, p3]  # first = highest
  suites: [smoke, regression]
  project: example-project
  required: [priority, project, component, suite]
  value_separator: ","           # joined values ("a,b") are checked part by part; "" = whole

eval:
  ticket_id_pattern: '\b[A-Z][A-Z0-9]+-\d+\b'   # Jira-style: KEY-123

tickets:
  github:
    api_url: https://api.github.com
    timeout_seconds: 30
    comments_per_page: 100
    max_comment_pages: 10
    component_label_prefixes: []   # e.g. ["component:"]
  jira:
    browse_url: null               # e.g. https://jira.example.com/browse
    field_map: {}                  # e.g. {steps_to_reproduce: customfield_10050}

normalize:
  max_comments: 50                 # long threads keep the first + most recent comments
  max_comment_chars: 4000

index:
  ignore: [.git, .hg, .svn, .venv, venv, env, __pycache__, node_modules, .tox, .nox,
           .mypy_cache, .ruff_cache, .pytest_cache, .scratch, build, dist, site-packages,
           "*.egg-info", vendor, vendored, third_party, "*_pb2.py", "*_pb2_grpc.py"]
  max_file_bytes: 1000000
  test_file_globs: ["test_*.py", "*_test.py"]
  test_function_prefix: test
  test_class_prefix: Test
  data_file_suffix: .json        # test_x.py -> test_x.json
  chain_roots: [nav]             # page-object chains start here: nav.<area>.<page>
  max_chain_depth: 4
  max_chain_entries: 50000        # the chain list only; page objects don't depend on it
  name_boost: 3
  save_attempts: 5               # index file rename retries (a scanner can lock it briefly)

data:                            # per-test JSON data files (reading accepts both layouts)
  format: array                  # array: [{"test_id": "<pytest id>", ...}]; object: {"<pytest id>": {...}}
  id_field: test_id               # the entry key holding the pytest id
  access: ["self.params", params]        # tests index these to read their entry
  seed_sections: [settings, policy, tenants, site]   # applied by the framework before the test
  expectation_sections:                  # section -> the helper that reads it (one per entry)
    targets: self.verify_targets
    interactions: self.verify_interactions
  per_entry_keys: [priority, skip]       # never inherited from the base entry

style:                           # the target suite's style; generated output is formatted to it
  python:
    indent_width: 3
    line_length: 100
    line_ending: lf
    quote_style: double
    strip_annotations: true
    final_newline: true
    first_party: []              # import-sorting roots; empty = the target repo's top-level packages
  json:
    indent: 3
    key_separator: ":"
    item_separator: ","
    ensure_ascii: false
    final_newline: true

retrieval:
  top_k: 10
  max_followup_rounds: 2
  use_llm: true                  # query rewrite + follow-ups; false = deterministic only
  query_rewrite_prompt: query_rewrite_v1
  followup_prompt: retrieval_followup_v1
  bm25_candidates: 50
  grep_max_matches: 40           # identifiers found in more chunks than this are too common
  rrf_k: 60
  expansion_seeds: 5
  expansion_per_seed: 4
  expansion_weight: 0.5
  followup_max_searches: 3
  followup_min_tests: 1          # follow-ups run only while top_k has fewer tests than this
  max_templates: 3
  shape_actions:                 # test shapes: templates of the draft's shape rank first
    add: [add, create, new]
    edit: [edit, update, change, rename, modify, enable, disable, toggle]
    delete: [delete, remove]
  max_ticket_chars: 6000
  rerank:                        # deterministic re-scoring + diversity of the final top_k
    enabled: true
    max_chunks_per_file: 3
    min_tests: 2
    identifier_weight: 0.3
    definition_weight: 0.2
    test_link_weight: 0.15
    path_weight: 0.15
  investigator:                  # bounded agent; replaces the follow-up rounds when enabled
    enabled: false
    prompt: investigator_v2
    max_steps: 6                 # LLM turns
    max_actions_per_step: 4
    max_tool_output_chars: 3000
    max_transcript_chars: 24000
    max_kept: 12
    results_per_search: 8

context:
  max_tokens: 12000
  chars_per_token: 3.0           # token estimate = ceil(chars / 3.0); over-counts on purpose

generate:
  prompt_version: generate_v4
  conventions_doc: null          # e.g. standin/CONVENTIONS.md; always included when set
  review_checklist_defaults:      # always on the reviewer checklist ("needs a real run")
    - Expected backend responses are not from a real capture; confirm them in a real run.
    - Check whether the page needs a refresh before a field is read again after saving.
    - Confirm the save flow (object save, top-bar save and publish, or reset).
  scaffold_methods: [setup, teardown, setup_method, teardown_method, setup_class, teardown_class,
                     setUp, tearDown, setUpClass, tearDownClass]   # copied with the scaffold
  placeholder_token: "{test_id:24}"   # unique names in data (N = max length)
  max_example_tests: 4
  deployment_decorators: {cloud: cloud_only, on_prem: on_prem_only}
  domain_globs: ["tests/*"]       # each matching folder is a domain (e.g. "<root>/<group>/*")
  domains: {}                     # optional: name -> [folder globs], overrides domain_globs
  reuse:                          # covered / variant / method / module decision
    candidates: 8
    covered_min: 0.8
    variant_min: 0.6
    method_min: 0.4
    method_named_min: 0.25         # ... when the class is named after the draft's subject
    domain_margin: 0.15
    frozen_classes: []             # new tests never go into these or their subclasses (e.g. a legacy base)
    environment_decorators: [environments]  # class decorators listing the deployments it runs on
  variant_prompt: variant_v1      # only when a new case can't be planned in code

validation:                     # deterministic checks of generated tests (Phase 7)
  base_classes: []                # every test class inherits one of them; empty: discovered from
                                  # the classes existing test classes inherit
  discover_base_classes: true
  assertion_object: self.check    # a unittest.TestCase instance
  testcase_bases: [unittest.TestCase, TestCase]   # classes inheriting these may also use self.assert*
  path_string_helpers: []         # helpers taking a dotted page path string; checked like chains
  forbid_page_locators: true      # tests use page actions and properties, never locator constants
  discover_path_string_helpers: true   # also: functions that split on "." and call getattr
  assertion_methods: [assertEqual, assertNotEqual, assertTrue, assertFalse, assertIn,
                      assertNotIn, assertIsNone, assertIsNotNone, assertGreater, assertLess,
                      assertRaises]
  external_modules: [pytest, selenium]   # importable besides stdlib and the target repo
  naming:                         # full-match regexes
    module: "test_[a-z0-9_]+"
    test_class: "Test[A-Z][A-Za-z0-9]*"
    test_function: "test_[a-z0-9_]+"
  name_keys: [name]               # seeded names must use the unique-name placeholder
  unique_name_sections: [settings, policy, tenants]   # where that applies (not site)
  name_max_length: 32             # the app's name length limit ({test_id:N} + suffix)
  unique_name_helper: self.unique_name
  placeholder_pattern: '\{[a-z_]+\d*(?::\d+)?\}'   # any data placeholder (regex)
  unique_name_pattern: '\{test_id:(\d+)\}'          # unique name; group 1 = max length
  capability_path: settings.capabilities
  capability_gates:               # component -> gates its features use (warning otherwise)
    rules: [rules, bulk_delete, import]
    profiles: [profiles]
    settings: [rules, profiles, bulk_delete, import, browser_limit]
    agent: [browser_limit]
    tenants: [rules, profiles]
  paging_actions: [next_page, previous_page]   # with count checks, expect a page-size read
  constant_properties: [page_size]

repair:
  max_attempts: 3                 # repair rounds after the first generation (errors only)
  prompt_version: repair_v1

sandbox:                          # `pytest --collect-only` in a container (Hard Constraint 3)
  runtime: docker                 # docker | podman (or T2T_SANDBOX__RUNTIME)
  timeout_seconds: 120
  image: t2t-sandbox:py3.12       # build: ticket2test sandbox --build
  base_image: docker.io/library/python:3.12-slim   # an approved image with Python
  requirements: null              # the target suite's test-time requirements file
                                  # (null: packaged default, pytest + selenium pinned)
  registry_auth: false            # false: never use the developer's registry logins
  memory: 1g
  pids_limit: 256
  work_dir: .scratch/sandbox      # staging folder per run (git-ignored)

results:                        # reading a real run's console log (`ticket2test results`)
  link_pattern: 'https?://(?:[\w-]+\.)*saucelabs\.com/\S+'   # remote-browser session links
  test_problem_errors: [AttributeError, NameError, KeyError, TypeError, ImportError,
                        ModuleNotFoundError, NoSuchElementException, InvalidSelectorException]
  environment_errors: [ConnectionError, NewConnectionError, MaxRetryError, ConnectTimeout,
                       ConnectTimeoutError, ReadTimeout, SSLError, gaierror,
                       ConnectionRefusedError, ConnectionResetError]   # couldn't reach the system
  max_message_chars: 1500

security:
  private_terms: []               # set ONLY in private config or T2T_SECURITY__PRIVATE_TERMS (JSON list)
  masking:                        # prompt-injection payloads never reach our own LLM
    enabled: true
    patterns:                     # instruction-like phrasing; the enclosing string/sentence is masked
      - '\bignore (?:all |any |previous |prior |the |above |earlier )*(?:instructions|prompts?|rules)\b'
      - '\bdisregard (?:all |any |previous |prior |the |above )*(?:instructions|rules)\b'
      - '\byou (?:are|must) now\b'
      - '\bnew task:'
      - '\bsystem prompt\b'
      - '\bact as (?:an? )?(?:admin|administrator|developer|system)\b'
      - '</?\s*(?:system|assistant|tool_call|function_call)\b'
    keys: [hidden_text, comment, alt, meta]   # JSON keys whose values are always masked
    min_chars: 1
    legend_prompt: masking_legend_v1

map:                             # suite map: area summaries from the index (no LLM)
  max_items: 15                  # per list in an area summary
  max_examples: 6                # typical tests per area, one per shape
  max_coverage_listed: 200       # in coverage.md; map.json has every gap
  max_tests_per_area: 300        # larger areas split into one sub-area per module

guides:                          # area guides: one strong-model call per area (no exploring)
  prompt: guide_v1
  max_budget_usd: 50.0           # hard ceiling; --budget can go lower, never higher
  max_input_tokens: 20000        # per area: the area summary + code picked by the tool
  max_piece_tokens: 3000         # a page object larger than this goes in as an outline
  max_output_tokens: 4000         # asked for; the Claude CLI doesn't enforce it
  # Worst case per call, raised by what real calls use (calibration.json next to the guides).
  # Defaults from the first run through the Claude CLI (2026-10-23): up to ~23k input tokens
  # of its own per call; Opus wrote ~5.3k output tokens against the 4k cap.
  call_overhead_tokens: 25000
  output_allowance_tokens: 8000
  max_areas_per_run: 50
  dir: null                      # default: output/guides/<repo folder name>
  use_in_generation: true        # the ticket's area guide goes into the generation context
  max_context_tokens: 1500       # how much of the guide may go there
  # USD per million tokens: for estimates, and when the provider reports no cost. Anthropic
  # first-party API prices as cached in the claude-api reference on 2026-10-06 (Haiku 5.5: up
  # to 100K-token prompts). Check your provider's price list.
  prices:
    claude-opus-5-5: {input_per_mtok: 4.0, output_per_mtok: 20.0}
    claude-sonnet-5-5: {input_per_mtok: 2.0, output_per_mtok: 10.0}
    claude-haiku-5-5: {input_per_mtok: 0.10, output_per_mtok: 0.50}

paths:
  output_dir: output
  cache_dir: .t2t_cache
  debug_log_dir: debug_logs
  prompts_dir: null          # default: the repo's prompts/ directory
