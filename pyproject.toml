[project]
name = "ticket2test"
version = "0.1.0"
description = "Turn bug tickets into reviewable draft test cases and runnable test code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DangNguyen254" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "google-genai>=2.28",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "typer>=0.12",
]

[project.scripts]
ticket2test = "ticket2test.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "selenium>=4.20",
    "types-pyyaml>=6.0",
    "uv>=0.12",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Keep the uv cache inside the repo (Hard Constraint 9).
cache-dir = ".scratch/uv-cache"

[tool.ruff]
line-length = 100
target-version = "py311"
# First-party roots: this project, and the synthetic stand-in's own packages.
src = ["src", "standin"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live' --basetemp=.scratch/pytest"
markers = [
    "live: calls real external services (network / LLM); skipped by default, run with -m live",
]
